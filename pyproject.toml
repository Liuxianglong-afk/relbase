[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relbase"
version = "0.1.0"
description = "Reliability-matched baselines for between-person overlap of extreme normative deviations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
license = {text = "MIT"}
authors = [{name = "Xianglong Liu"}]

[project.urls]
Repository = "https://github.com/Liuxianglong-afk/relbase"
Archive = "https://doi.org/10.5281/zenodo.23874914"

[tool.setuptools]
packages = ["relbase"]
